name: Xenvera Docker Build

# Builds the patched Documenso image and pushes it to GHCR, tagged with the
# branch name.

on:
  workflow_dispatch:
  push:
    branches: ['xenvera-*']

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        run: |
          docker build \
            -f ./docker/Dockerfile \
            --progress=plain \
            -t "ghcr.io/darrellcui/documenso:${GITHUB_REF_NAME}" \
            .

      - name: Push image
        run: docker push "ghcr.io/darrellcui/documenso:${GITHUB_REF_NAME}"
